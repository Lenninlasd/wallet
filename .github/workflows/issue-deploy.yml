name: Issue-based Dev/Prod existent image deploy 

on:
  issues:
    types: 
      - opened
      - edited
      
  issue_comment:
     types: 
       - created
jobs:
  extract-context:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.extract_variables.outputs.environment }}
      tag_img: ${{ steps.extract_variables.outputs.tag_img }}
    steps:
      - name: Extract variables
        id: extract_variables
        run: |
          
          # Extracting variables from issue or comment body
          ISSUE_BODY="${{ github.event.issue.body }}"

          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            ISSUE_BODY="${{ github.event.issue_comment.body }}"
          fi

          ENV=$(echo "$ISSUE_BODY" | grep -o -- '--env [^ ]*' | cut -d' ' -f2)
          TAG=$(echo "$ISSUE_BODY" | grep -o -- '--tag [^ ]*' | cut -d' ' -f2)

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "tag_img=wallet-${TAG}" >> "$GITHUB_OUTPUT"
          
          if [ "${ENV}" == "dev" ]; then
            echo "tag_img=wallet-dev-${TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "env: $environment"
          echo "tag_img: $tag_img"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [extract-context]
    env:
      ENV: ${{needs.extract-context.outputs.environment}}
      TAG: ${{needs.extract-context.outputs.tag_img}}
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Wallet
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            docker pull registry.digitalocean.com/zener/engine:${{ env.TAG }}

            if [ "$(docker ps -aq --filter 'name=^/wallet_prod$')" ]; then
              echo "Stopping and removing the existing wallet_prod container..."
              docker stop wallet_prod
              docker rm wallet_prod
            else
              echo "No running wallet container found."
            fi

            docker run -d \
              --name wallet_prod \
              --network zener_mynetwork \
              -p 8002:8002 \
              -e MNEMONIC_WORDS='${{ secrets.MNEMONIC_WORDS }}' \
              -e WITHDRAWAL_INTEGRITY=${{ secrets.WITHDRAWAL_INTEGRITY }} \
              -e BITCOIN_NETWORK=Mainnet \
              registry.digitalocean.com/zener/engine:${{ env.TAG_NAME }}
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [extract-context]
    env:
      ENV: ${{needs.extract-context.outputs.environment}}
      TAG: ${{needs.extract-context.outputs.tag_img}}
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Wallet
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            docker pull registry.digitalocean.com/zener/engine:${{ env.TAG }}

            if [ "$(docker ps -aq --filter 'name=^/wallet$')" ]; then
              echo "Stopping and removing the existing wallet container..."
              docker stop wallet
              docker rm wallet
            else
              echo "No running wallet container found."
            fi

            docker run -d \
              --name wallet \
              --network zener_mynetwork \
              -p 8000:8000 \
              -e MNEMONIC_WORDS='${{ secrets.TEST_MNEMONIC_WORDS }}' \
              -e WITHDRAWAL_INTEGRITY=${{ secrets.TEST_WITHDRAWAL_INTEGRITY }} \
              -e BITCOIN_NETWORK=Testnet \
              registry.digitalocean.com/zener/engine:${{ env.TAG }}
